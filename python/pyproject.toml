[project]
name = "monorepoprompt"
version = "0.1.0"
description = "Python SDK and MCP server for the MonorepoPrompt layered context engine"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]

[project.scripts]
monorepoprompt-mcp = "monorepoprompt.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/monorepoprompt"]